# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
classify_model: assets/tiny_resnet.onnx
yolov5_model_path: assets/0708.xml
device: CPU
# Number of reusable OpenVINO requests kept in flight by YOLO and MultiThreadDetector.
infer_request_buffer_num: 5
min_confidence: 0.0
use_traditional: false

dynamic_roi:
  enabled: false
  expand_ratio: 1.4
  base_expand_ratio: 3.0
  net_ratio: 1.0
  lost_time: 0.5

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25
outpost_max_temp_lost_count: 75
armor_association:
  enabled: false
  center_gate_px: 100.0
  corner_gate_px: 140.0
  angle_gate_rad: 0.8
  perimeter_ratio_gate: 0.6
  image_observation:
    enabled: false
    point_sigma_px: 8.0

#####-----aimer参数-----#####
yaw_offset: -9.0 # degree -2.5  向右为负
pitch_offset: 1.0 # degree 2  向上为正
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.01 # s
low_speed_delay_time: 0.01 # s 

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 6.0
gain: 16.9
frame_rate: 165
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.0918px
camera_matrix: [1850.0977161749593, 0, 710.63421936359202, 0, 1848.6943471449351, 549.13749846456096, 0, 0, 1]
distort_coeffs: [-0.060913344604850199, 0.11774786267506449, -0.0019223400180306367, -0.0019701464715510902, 0]

# 相机同理想情况的偏角: yaw-0.25 pitch1.75 roll-7.12 degree
R_camera2gimbal: [0.00048622843439272145, 0.030851393170502468, 0.99952386420802819, -0.99230239509046125, -0.12376365571495085, 0.0043028155671873238, 0.12383747526352322, -0.9918320165549761, 0.030553733926414139]
t_camera2gimbal: [0.092605722425708623, 0.092642888073632274, 0.02746801555779475]

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

#####-----planner-----#####
fire_thresh_high_speed: 1e-3   # 高速旋转时使用较宽松的阈值
fire_thresh_low_speed: 1e-4    # 低速/静止时使用较严格的阈值

max_yaw_acc: 50
Q_yaw: [9e9, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e9, 0]
R_pitch: [1]
