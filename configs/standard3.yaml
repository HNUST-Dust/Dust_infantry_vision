# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
classify_model: assets/tiny_resnet.onnx
yolov5_model_path: assets/0708.xml
device: GPU
# Number of reusable OpenVINO requests kept in flight by YOLO and MultiThreadDetector.
infer_request_buffer_num: 5
min_confidence: 0.0
use_traditional: false

dynamic_roi:
  enabled: true
  expand_ratio: 1.4
  base_expand_ratio: 3.0
  net_ratio: 1.0
  lost_time: 0.5

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25
outpost_max_temp_lost_count: 75
armor_association:
  enabled: true
  center_gate_px: 100.0
  corner_gate_px: 140.0
  angle_gate_rad: 0.8
  perimeter_ratio_gate: 0.6
  image_observation:
    enabled: true
    point_sigma_px: 8.0

#####-----aimer参数-----#####
yaw_offset: -5.0 # degree -2.5  向右为负
pitch_offset: 1.8 # degree 2  向上为正
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.01 # s
low_speed_delay_time: 0.01 # s 

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 6.0
gain: 16.9
frame_rate: 165
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.0810px
camera_matrix: [1772.9522573009506, 0, 710.9675421991991, 0, 1773.7469537258482, 558.21505301821605, 0, 0, 1]
distort_coeffs: [-0.081031579387608993, 0.088293870276620307, 0.00031827674235934792, -0.00043187419152307871, 0]

# 相机同理想情况的偏角: yaw-1.60 pitch-1.00 roll2.87 degree
R_camera2gimbal: [0.026937008699372988, -0.018830116998824867, 0.999459766201792, -0.99837928036845069, 0.0496344538528386, 0.027843015671890355, -0.050131926886013319, -0.99858992969313554, -0.017462594943318033]
t_camera2gimbal: [0.28154374088604311, 0.24670979582321115, 0.067270501450574019]

#####-----gimbal参数-----#####
gimbal_transport: "usb_interrupt"
usb_vid: 0x34b7
usb_pid: 0xffff
usb_interface: 0
usb_ep_in: 0x81
usb_ep_out: 0x01

#####-----planner-----#####
fire_thresh_high_speed: 1e-3   # 高速旋转时使用较宽松的阈值
fire_thresh_low_speed: 1e-4    # 低速/静止时使用较严格的阈值

max_yaw_acc: 50
Q_yaw: [9e9, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e9, 0]
R_pitch: [1]
