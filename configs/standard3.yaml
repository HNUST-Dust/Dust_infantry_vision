# enemy_color: "red"
enemy_color: "blue"

#####-----运行模式-----#####
runtime:
  simulate_gimbal: false   # 虚拟云台：姿态与串口都走模拟，不依赖真机（默认 false）
  headless: true          # 关闭检测可视化与窗口事件，无桌面运行（如开机自启）时置 true（默认 false）
  verbose_ekf: false      # 每帧输出 EKF 11 维状态，165fps 下会刷满日志（默认 false）
  foxglove: true         # 启用 Foxglove 图像与遥测推送，监听与编码参数见下面的 foxglove 段（默认 false）
  fire_timeout_ms: 30     # 最后一次真实匹配超过此时间后禁止开火
  control_timeout_ms: 80  # 最后一次真实匹配超过此时间后停止目标控制
  feedback_timeout_ms: 100 # 云台姿态反馈超时后停止目标控制
  plan_timeout_ms: 20     # 计划生成超时后停止目标控制
  
#####-----神经网络参数-----#####
classify_model: assets/tiny_resnet.onnx
inference_backend: openvino # openvino / tensorrt；切换时同时修改模型路径和颜色顺序
yolov5_model_path: assets/yolov5.xml
# TensorRT 配置：将 inference_backend 改为 tensorrt，并替换上面的模型路径。
# yolov5_model_path: assets/0526.engine # 需在本机生成，并以 -DENABLE_TENSORRT=ON 编译
# yolov5_color_order: [blue, red, gray, purple] # 0526 模型；切回 yolov5.xml 时删除此项
cuda_device: 0 # TensorRT 使用的 CUDA 设备编号
# 以下 device / performance_mode 仅用于 OpenVINO。
# CPU is the stable real-time default when GNOME shares the Intel iGPU.
# Set to GPU only in headless mode or with a dedicated GPU.
device: GPU
# Number of reusable OpenVINO requests kept in flight by YOLO and MultiThreadDetector.
infer_request_buffer_num: 2
performance_mode: THROUGHPUT # THROUGHPUT / LATENCY
min_confidence: 0.8
use_traditional: true

dynamic_roi:
  enabled: true
  expand_ratio: 1.4
  base_expand_ratio: 3.0
  net_ratio: 1.0
  lost_time: 0.5

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25
outpost_max_temp_lost_count: 75
armor_association:
  enabled: true
  center_gate_px: 100.0
  corner_gate_px: 140.0
  angle_gate_rad: 0.8
  perimeter_ratio_gate: 0.6
  image_observation:
    enabled: true
    point_sigma_px: 8.0
  pnp_observation:
    point_sigma_px: 8.0
    angle_prior_rad: 0.15

#####-----planner 瞄准/弹道参数（原 aimer，2026-10-03 并入）-----#####
yaw_offset: -10.0 # degree -2.5  向右为负
pitch_offset: 0.0 # degree 2  向上为正
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.01 # s  规划，下发，云台到达，发弹延迟
low_speed_delay_time: 0.01 # s 

#####-----planner 开火参数（原 shooter，2026-10-03 并入）-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 0.5
gain: 16.9
frame_rate: 250
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.0595px
camera_matrix: [1808.8304696430803, 0, 713.70459283498224, 0, 1808.0411873540195, 566.09347726083934, 0, 0, 1]
distort_coeffs: [-0.073241403353599299, 0.14495759982904788, 0.00028937879061362732, -0.00026770913811837289, 0]

# 相机同理想情况的偏角: yaw77.32 pitch3.16 roll-3.15 degree
R_camera2gimbal: [-0.97477295614453796, -0.04155903544245064, 0.21929553242674979, -0.21633519687120553, -0.065859247409107979, -0.97409529417064877, 0.054925099580567724, -0.99696309164572339, 0.055207131172210655]
t_camera2gimbal: [0.11357667283627036, -0.11551828418637766, 0.032185558486523859]

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
baudrate: 460800

#####-----Foxglove-----#####
# 仅当 runtime.foxglove 为 true 时生效：启用开关在 runtime 段，监听与编码参数在这里
foxglove:
  host: "127.0.0.1"   # 监听地址
  port: 8766          # 图像端口；data_port 为 0 时同时承载遥测
  data_port: 0        # 非 0 时遥测走独立端口，与图像互不抢占带宽
  fps: 30             # 图像发布帧率上限，超出的帧直接丢弃、不排队
  scale: 0.5          # 发布前缩放系数 (0,1]
  sched: auto         # 发布线程降级让出 CPU 给推理 (auto/off)
  jpeg_quality: 80    # JPEG 质量 (1-100)

#####-----planner TinyMPC-----#####
fire_thresh_high_speed: 1e-3   # 高速旋转时使用较宽松的阈值
fire_thresh_low_speed: 1e-4    # 低速/静止时使用较严格的阈值

max_yaw_acc: 150
Q_yaw: [9e9, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e9, 0]
R_pitch: [1]
